name: ci
# Every branch push; pull requests from this repo get the result through their head commit.
on:
  push:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run lint
      - run: npm run unit
      - name: index.html und sw.js passen zu src/
        run: npm run build && git diff --exit-code
      - run: npm run smoke
      - run: npm run fairness -- --seeds 10
      - run: npm run snapshots
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs
          path: test/snapshots/out/
          if-no-files-found: ignore
