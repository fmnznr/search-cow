name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: index.html und sw.js passen zu src/
        run: npm run build && git diff --exit-code
      - run: npm run smoke
      - run: npm run fairness -- --seeds 10
